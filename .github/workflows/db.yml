name: DB (RLS)

# The pgTAP suite in supabase/tests is the security backstop for the RLS rules,
# so it has to run in CI — a local-only suite is how a contact-leaking policy
# shipped in S1. Kept in its own workflow with a path filter so unrelated PRs
# don't pay for booting Supabase.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/db.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/db.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    name: RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start Supabase
        run: supabase start
      - name: Apply migrations and seed
        run: supabase db reset
      - name: Run the RLS suite
        run: supabase test db
      - name: Write .env.local for the app
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" > .env.local
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Auth e2e (@auth)
        run: AUTH_E2E=1 npx playwright test tests/e2e/auth.spec.ts
